name: CI
// This workflow runs on every push to the repository. It has two jobs: build and test. The build job checks out the code and runs a simple script, while the test job checks out the code and runs a placeholder for testing.

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checks out the current git commit so we can use it.
      # read more at https://github.com/orgs/community/discussions/25682
      - uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo "Write your CI workflow here!"
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the code
        run: echo "Replace this with the test code"
